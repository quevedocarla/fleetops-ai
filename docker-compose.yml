services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fleetops-postgres
    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - "5432:5432"

    volumes:
      - fleetops_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U fleetops -d fleetops"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fleetops-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env.docker

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  fleetops_postgres_data:
